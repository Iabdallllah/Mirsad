name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Production build
        run: npm run build
        env:
          # Placeholder build-time values; no real secret is used or needed.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  api:
    name: API — ruff, mypy, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not integration"

  worker:
    name: Worker — ruff, mypy, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  containers:
    name: Containers — build API/worker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/api.Dockerfile -t mirsad-api:ci .
      - run: docker build -f infra/docker/worker.Dockerfile -t mirsad-worker:ci .
      - name: API image health smoke test
        run: |
          docker run -d --rm --name mirsad-api-ci -p 8000:8000 \
            -e APP_ENV=development \
            -e SUPABASE_JWT_SECRET=ci-placeholder-secret-0123456789abcdef \
            mirsad-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs mirsad-api-ci
          exit 1

  integration:
    name: Database + API integration + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci
      - run: python -m pip install uv==0.11.29
      - run: npm install --global supabase@3.3.0

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset

      - name: Write git-ignored local test env
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          node -e '
            const fs = require("fs");
            const env = Object.fromEntries(
              fs.readFileSync(process.env.RUNNER_TEMP + "/supabase.env", "utf8")
                .split(/\r?\n/).filter((line) => line.includes("="))
                .map((line) => {
                  const i = line.indexOf("=");
                  let value = line.slice(i + 1).trim();
                  if (
                    (value.startsWith('"') && value.endsWith('"')) ||
                    (value.startsWith("'") && value.endsWith("'"))
                  ) {
                    value = value.slice(1, -1);
                  }
                  return [line.slice(0, i), value];
                }),
            );
            if (!env.API_URL || !env.ANON_KEY) {
              throw new Error("supabase status did not provide API_URL/ANON_KEY");
            }
            fs.writeFileSync(".env.test", [
              `NEXT_PUBLIC_SUPABASE_URL=${env.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_ANON_KEY=${env.ANON_KEY}`,
              `SUPABASE_SERVICE_ROLE_KEY=${env.SERVICE_ROLE_KEY}`,
              `SUPABASE_DB_URL=${env.DB_URL}`,
              `DATABASE_URL=${env.DB_URL}`,
            ].join("\n") + "\n");
            // Next dev reads NEXT_PUBLIC_* from apps/web/.env.local on disk;
            // writing it here avoids relying on process-env propagation through
            // the Playwright webServer -> npm -> next chain.
            fs.writeFileSync("apps/web/.env.local", [
              `NEXT_PUBLIC_SUPABASE_URL=${env.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_ANON_KEY=${env.ANON_KEY}`,
              `NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1`,
              `NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000`,
            ].join("\n") + "\n");
            // Next skips .env.local when NODE_ENV=test (Playwright). .env.test.local
            // is loaded in the test environment, so write it too.
            fs.writeFileSync("apps/web/.env.test.local", [
              `NEXT_PUBLIC_SUPABASE_URL=${env.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_ANON_KEY=${env.ANON_KEY}`,
              `NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1`,
              `NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000`,
            ].join("\n") + "\n");
          '

      - name: Database security/RLS tests
        working-directory: supabase
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: API integration tests
        working-directory: services/api
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          uv sync --frozen
          uv run pytest -q -m integration

      - run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
