[project]
name = "mirsad-api"
version = "0.0.0"
description = "Mirsad FastAPI API — auth validation, workspace APIs, webhooks (plan.md §4.3, §10)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.14.4",
    "pydantic-settings==2.9.1",
    "asyncpg==0.30.0",
    "PyJWT[crypto]==2.10.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.13",
    "mypy==1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a reachable Postgres/Supabase local database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true
